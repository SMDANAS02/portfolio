<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 40px; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); font-family: 'Inter', sans-serif; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { color: white; font-size: 32px; margin: 0; }
  p { color: rgba(255,255,255,0.9); font-size: 16px; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
  .item { background: rgba(255,255,255,0.2); padding: 20px; border-radius: 10px; color: white; }
  .item-num { font-size: 24px; font-weight: bold; }
  .item-label { font-size: 12px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="container">
    <h1>👥 Smart Volunteer Allocation</h1>
    <p>Rule-Based Task Assignment System</p>
    <div class="grid">
      <div class="item">
        <div class="item-num">100%</div>
        <div class="item-label">Automated</div>
      </div>
      <div class="item">
        <div class="item-num">0ms</div>
        <div class="item-label">Latency</div>
      </div>
      <div class="item">
        <div class="item-num">Skills</div>
        <div class="item-label">Matched</div>
      </div>
      <div class="item">
        <div class="item-num">Fast</div>
        <div class="item-label">Allocation</div>
      </div>
    </div>
  </div>
</body>
</html>
