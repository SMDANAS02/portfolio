<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 40px; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); font-family: 'Inter', sans-serif; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { color: #333; font-size: 32px; margin: 0; }
  p { color: #555; font-size: 16px; margin-top: 10px; }
  .features { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  .feature { background: rgba(255,255,255,0.8); padding: 12px 15px; border-radius: 8px; font-size: 14px; color: #333; }
  .feature::before { content: '▸ '; font-weight: bold; color: #fa709a; }
</style>
</head>
<body>
  <div class="container">
    <h1>🛒 E-commerce Product Catalog</h1>
    <p>Full-Stack Shopping Experience</p>
    <div class="features">
      <div class="feature">Secure Authentication</div>
      <div class="feature">Product Catalog</div>
      <div class="feature">Order Management</div>
      <div class="feature">Payment Integration</div>
    </div>
  </div>
</body>
</html>
