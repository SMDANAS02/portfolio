<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Inter', sans-serif; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { color: white; font-size: 32px; margin: 0; }
  p { color: rgba(255,255,255,0.9); font-size: 16px; margin-top: 10px; }
  .stats { display: flex; gap: 30px; margin-top: 30px; }
  .stat { color: white; }
  .stat-num { font-size: 28px; font-weight: bold; }
  .stat-label { font-size: 12px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="container">
    <h1>📊 VSB-APEX</h1>
    <p>Analytics Dashboard for Academic Data</p>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">200+</div>
        <div class="stat-label">Students</div>
      </div>
      <div class="stat">
        <div class="stat-num">70%</div>
        <div class="stat-label">Less Manual Work</div>
      </div>
      <div class="stat">
        <div class="stat-num">Real-time</div>
        <div class="stat-label">Analytics</div>
      </div>
    </div>
  </div>
</body>
</html>
